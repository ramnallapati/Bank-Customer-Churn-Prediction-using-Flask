<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bank Customer Churn Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<div class="card shadow-lg">

<div class="header">

<h2>🏦 Bank Customer Churn Prediction</h2>

<p>Predict whether a customer will leave the bank.</p>

</div>

<div class="card-body">

<form action="/predict" method="POST">

<div class="row">

<div class="col-md-6">

<label>Credit Score</label>
<input type="number" name="CreditScore" class="form-control" required>

</div>

<div class="col-md-6">

<label>Age</label>
<input type="number" name="Age" class="form-control" required>

</div>

<div class="col-md-6">

<label>Balance</label>
<input type="number" step="0.01" name="Balance" class="form-control" required>

</div>

<div class="col-md-6">

<label>Estimated Salary</label>
<input type="number" step="0.01" name="EstimatedSalary" class="form-control" required>

</div>

<div class="col-md-6">

<label>Tenure</label>
<input type="number" name="Tenure" class="form-control" required>

</div>

<div class="col-md-6">

<label>Number of Products</label>
<input type="number" name="NumOfProducts" class="form-control" required>

</div>

<div class="col-md-6">

<label>Gender</label>

<select class="form-select" name="Gender">

<option value="Male">Male</option>

<option value="Female">Female</option>

</select>

</div>

<div class="col-md-6">

<label>Geography</label>

<select class="form-select" name="Geography">

<option value="France">France</option>

<option value="Germany">Germany</option>

<option value="Spain">Spain</option>

</select>

</div>

<div class="col-md-6">

<label>Has Credit Card</label>

<select class="form-select" name="HasCrCard">

<option value="1">Yes</option>

<option value="0">No</option>

</select>

</div>

<div class="col-md-6">

<label>Active Member</label>

<select class="form-select" name="IsActiveMember">

<option value="1">Yes</option>

<option value="0">No</option>

</select>

</div>

</div>

<div class="d-grid mt-4">

<button class="btn btn-primary btn-lg">

Predict Churn

</button>

</div>

</form>

{% if prediction %}

<div class="alert alert-{{color}} mt-4">

<h4>{{prediction}}</h4>

<h5>Probability : {{probability}}</h5>

</div>

{% endif %}

</div>

</div>

</div>

</body>

</html>
